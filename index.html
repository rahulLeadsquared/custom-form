<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Form</title>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #D8DCE2;
    --border-focus: #3A6EA5;
    --text: #1B2430;
    --text-muted: #616B7A;
    --primary: #3A6EA5;
    --primary-hover: #2F5C8A;
    --danger: #B3431E;
    --danger-hover: #963616;
    --neutral: #EEF0F3;
    --neutral-hover: #E2E5EA;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  form {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .form-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .form-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }

  .required::after {
    content: " *";
    color: var(--danger);
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(58, 110, 165, 0.15);
  }

  input[type="text"].invalid {
    border-color: var(--danger);
  }

  .error-text {
    font-size: 12px;
    color: var(--danger);
    margin-top: 5px;
    display: none;
  }

  .error-text.show { display: block; }

  .file-drop {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .file-drop:hover { border-color: var(--border-focus); }

  .file-drop.dragover {
    border-color: var(--border-focus);
    background: rgba(58, 110, 165, 0.06);
  }

  .file-drop input[type="file"] { display: none; }

  .file-drop-text {
    font-size: 13px;
    color: var(--text-muted);
  }

  .file-drop-text strong {
    color: var(--primary);
    font-weight: 600;
  }

  .file-selected {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
  }

  .file-selected.show { display: flex; }

  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .file-remove {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 22px;
  }

  button {
    flex: 1;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  button:active { opacity: 0.85; }

  .btn-submit {
    background: var(--primary);
    color: #fff;
  }
  .btn-submit:hover { background: var(--primary-hover); }
  .btn-submit:disabled {
    background: #A8B4C2;
    cursor: not-allowed;
  }

  .btn-cancel {
    background: var(--surface);
    color: var(--danger);
    border-color: var(--border);
  }
  .btn-cancel:hover { background: var(--neutral); }

  .btn-close {
    background: var(--neutral);
    color: var(--text);
  }
  .btn-close:hover { background: var(--neutral-hover); }

  .debug-panel {
    width: 100%;
    max-width: 420px;
    margin: 0 0 12px;
    background: #1B2430;
    color: #D8DCE2;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: 12px;
    display: none;
  }

  .debug-panel.show { display: block; }

  .debug-panel-title {
    font-weight: 700;
    color: #fff;
    margin: 0 0 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .debug-section {
    margin-bottom: 8px;
  }

  .debug-section:last-child { margin-bottom: 0; }

  .debug-label {
    color: #8AA0BF;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .debug-row {
    display: flex;
    gap: 6px;
    word-break: break-all;
    line-height: 1.5;
  }

  .debug-key { color: #7FB3E8; flex-shrink: 0; }
  .debug-val { color: #D8DCE2; }

  .debug-empty { color: #616B7A; font-style: italic; }

  .debug-banner {
    display: none;
    padding: 8px 10px;
    border-radius: 5px;
    margin-bottom: 10px;
    font-size: 11px;
    line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .debug-banner.show { display: block; }
  .debug-banner.bad  { background: #4A1A0D; color: #FFB59B; border: 1px solid #B3431E; }
  .debug-banner.good { background: #10331F; color: #8FD9AE; border: 1px solid #2E7D4F; }

  .ctx-table { width: 100%; border-collapse: collapse; }
  .ctx-table td {
    padding: 4px 0;
    vertical-align: top;
    border-bottom: 1px solid #2A3542;
    word-break: break-all;
  }
  .ctx-table tr:last-child td { border-bottom: none; }
  .ctx-key { color: #7FB3E8; width: 34%; padding-right: 8px !important; }
  .ctx-val { color: #D8DCE2; }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .badge-ok      { background: #1E5B38; color: #A7E8C4; }
  .badge-absent  { background: #3A424D; color: #A8B4C2; }
  .badge-empty   { background: #6B5312; color: #F2D488; }
  .badge-token   { background: #7A2A11; color: #FFC0AA; }

  .debug-url {
    color: #D8DCE2;
    word-break: break-all;
    line-height: 1.5;
    background: #121A24;
    padding: 7px 8px;
    border-radius: 4px;
  }

  .debug-copy {
    margin-top: 7px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    background: #2A3542;
    color: #D8DCE2;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    flex: none;
    width: auto;
  }
  .debug-copy:hover { background: #354254; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100% - 32px);
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 36, 48, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }

  .confirm-overlay.show { display: flex; }

  .confirm-box {
    background: var(--surface);
    border-radius: 10px;
    padding: 18px;
    width: 100%;
    max-width: 320px;
  }

  .confirm-box p {
    margin: 0 0 16px;
    font-size: 14px;
    color: var(--text);
  }

  .confirm-actions {
    display: flex;
    gap: 8px;
  }

  .confirm-actions button {
    padding: 9px 12px;
    font-size: 13px;
  }

  .btn-confirm-yes {
    background: var(--danger);
    color: #fff;
  }
  .btn-confirm-yes:hover { background: var(--danger-hover); }

  .btn-confirm-no {
    background: var(--neutral);
    color: var(--text);
  }
  .btn-confirm-no:hover { background: var(--neutral-hover); }
</style>
</head>
<body>

<div class="screen" style="flex-direction: column; align-items: center;">

  <div class="debug-panel show" id="debugPanel">
    <p class="debug-panel-title">LSQ context debug</p>

    <div class="debug-banner" id="debugBanner"></div>

    <div class="debug-section">
      <div class="debug-label">Entity context (AC9)</div>
      <table class="ctx-table" id="ctxTable"></table>
    </div>

    <div class="debug-section">
      <div class="debug-label">Other query params</div>
      <div id="debugParams"><span class="debug-empty">none</span></div>
    </div>

    <div class="debug-section">
      <div class="debug-label">Resolved URL</div>
      <div class="debug-url" id="debugUrl"></div>
      <button type="button" class="debug-copy" id="debugCopy">Copy URL</button>
    </div>

    <div class="debug-section">
      <div class="debug-label">Native bridge</div>
      <div id="debugBridge"></div>
    </div>

    <div class="debug-section">
      <div class="debug-label">Headers (via native bridge only)</div>
      <div id="debugHeaders"><span class="debug-empty">none received</span></div>
    </div>
  </div>

  <form id="customForm" novalidate>
    <p class="form-title">Submit details</p>
    <p class="form-subtitle">Fill in both fields and attach a file.</p>

    <div class="field">
      <label for="fieldOne" class="required">Field one</label>
      <input type="text" id="fieldOne" name="fieldOne" autocomplete="off">
      <div class="error-text" id="fieldOneError">This field is required.</div>
    </div>

    <div class="field">
      <label for="fieldTwo" class="required">Field two</label>
      <input type="text" id="fieldTwo" name="fieldTwo" autocomplete="off">
      <div class="error-text" id="fieldTwoError">This field is required.</div>
    </div>

    <div class="field">
      <label for="fileInput">Attachment (optional)</label>
      <div class="file-drop" id="fileDrop">
        <input type="file" id="fileInput" name="fileInput">
        <div class="file-drop-text"><strong>Choose a file</strong> or drop it here</div>
      </div>
      <div class="file-selected" id="fileSelected">
        <span class="file-name" id="fileName"></span>
        <button type="button" class="file-remove" id="fileRemove">Remove</button>
      </div>

    </div>

    <div class="actions">
      <button type="button" class="btn-close" id="closeBtn">Close</button>
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-submit" id="submitBtn">Submit</button>
    </div>
  </form>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p>Discard the entered data?</p>
    <div class="confirm-actions">
      <button type="button" class="btn-confirm-no" id="confirmNo">Keep editing</button>
      <button type="button" class="btn-confirm-yes" id="confirmYes">Discard</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  // ---- Debug panel: query params + optional native-injected headers ----
  const debugPanel = document.getElementById('debugPanel');
  const debugParams = document.getElementById('debugParams');
  const debugHeaders = document.getElementById('debugHeaders');

  function renderKeyVals(container, entries) {
    if (!entries.length) {
      container.innerHTML = '<span class="debug-empty">none</span>';
      return;
    }
    container.innerHTML = entries.map(([k, v]) =>
      `<div class="debug-row"><span class="debug-key">${escapeHtml(k)}:</span><span class="debug-val">${escapeHtml(v)}</span></div>`
    ).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ------------------------------------------------------------------
  // Entity-context diagnostics (AC9)
  //
  // How the IDs actually arrive, traced through androidcoreapp @ c5d76998cdb8:
  //
  //   ExternalFormLauncher.entityIdKeyValues()  builds KeyValues for
  //     leadId / opportunityId / activityId / taskId  (empty ones are dropped)
  //        -> Intent extra INTENT_MAIL_MERGE_ID_KEY_VALUES
  //        -> WebViewActivity.mailMergeUrl() runs LSMailMergeEngine over the
  //           ADMIN-CONFIGURED URL with MailMergeType.LOCAL_AND_SERVER
  //        -> LSLocalMailMergeDecorator: local pass first, then server pass
  //             local  = LSLocalMailMerge, resolves @{User:*} on-device
  //             server = LSServerMailMerge, POSTs {data:<url>, leadId, ...}
  //        -> the merged URL is what this page finally loads
  //
  // Token syntax is Util.MAIL_MERGE_REGEX:  @{Entity:Schema, }
  //   -> the comma before the closing brace is MANDATORY
  //   -> MailMergeEntity has only: User, Lead, Opportunity, Account, Default
  //      There is NO Activity or Task entity, so @{Activity:...} / @{Task:...}
  //      cannot resolve locally and depend entirely on the server endpoint.
  //   -> @{User:UserId, } is resolved locally by UserMailMergeValueProvider.
  //
  // A token left verbatim in the URL means the merge did NOT resolve it.
  // That is the single most useful signal on this panel.
  // ------------------------------------------------------------------
  const EXPECTED_KEYS = [
    ['leadId',        'Lead ID'],
    ['opportunityId', 'Opportunity ID'],
    ['activityId',    'Activity ID'],
    ['taskId',        'Task ID'],
    ['userId',        'User ID']
  ];

  // Matches an unresolved LSQ mail-merge token, e.g. "@{Lead:ProspectId, }"
  const UNRESOLVED_TOKEN = /@\{[\w-]+:[^}]*\}/;

  const params = new URLSearchParams(window.location.search);
  const paramEntries = [...params.entries()];
  const expectedNames = EXPECTED_KEYS.map(([k]) => k);

  function classify(rawValue) {
    if (rawValue === null)                     return { badge: 'absent', label: 'NOT SENT',      cls: 'badge-absent' };
    if (rawValue.trim() === '')                return { badge: 'empty',  label: 'SENT EMPTY',    cls: 'badge-empty'  };
    if (UNRESOLVED_TOKEN.test(rawValue))       return { badge: 'token',  label: 'NOT MERGED',    cls: 'badge-token'  };
    return { badge: 'ok', label: 'OK', cls: 'badge-ok' };
  }

  const results = EXPECTED_KEYS.map(([key, label]) => {
    const raw = params.get(key);
    return { key, label, raw, state: classify(raw) };
  });

  document.getElementById('ctxTable').innerHTML = results.map(r => `
    <tr>
      <td class="ctx-key">${escapeHtml(r.label)}<br><span style="opacity:.6">${escapeHtml(r.key)}</span></td>
      <td class="ctx-val">
        <span class="badge ${r.state.cls}">${r.state.label}</span>
        ${r.raw !== null && r.raw.trim() !== '' ? `<div style="margin-top:4px">${escapeHtml(r.raw)}</div>` : ''}
      </td>
    </tr>`).join('');

  // Extra params beyond the five expected ones
  renderKeyVals(debugParams, paramEntries.filter(([k]) => !expectedNames.includes(k)));

  // Full resolved URL — the definitive record of what native handed the page
  const debugUrlEl = document.getElementById('debugUrl');
  let decodedUrl = window.location.href;
  try { decodedUrl = decodeURIComponent(window.location.href); } catch (e) { /* keep raw */ }
  debugUrlEl.textContent = decodedUrl;

  document.getElementById('debugCopy').addEventListener('click', function () {
    const done = () => { this.textContent = 'Copied'; setTimeout(() => { this.textContent = 'Copy URL'; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(window.location.href).then(done).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = window.location.href;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  // Verdict banner
  const banner = document.getElementById('debugBanner');
  const notMerged = results.filter(r => r.state.badge === 'token');
  const urlHasToken = UNRESOLVED_TOKEN.test(decodedUrl);
  const resolved = results.filter(r => r.state.badge === 'ok');

  if (notMerged.length || urlHasToken) {
    banner.className = 'debug-banner show bad';
    banner.innerHTML =
      '<strong>Mail merge did not fully resolve.</strong><br>' +
      (notMerged.length
        ? 'Unresolved: ' + notMerged.map(r => escapeHtml(r.key)).join(', ') + '. '
        : '') +
      'A verbatim <code>@{Entity:Schema, }</code> token in the URL means neither the local nor the server pass substituted it.';
  } else if (resolved.length) {
    banner.className = 'debug-banner show good';
    banner.innerHTML = '<strong>' + resolved.length + ' of ' + EXPECTED_KEYS.length +
      ' context values resolved.</strong> Values still need cross-checking against the originating record.';
  } else {
    banner.className = 'debug-banner show bad';
    banner.innerHTML = '<strong>No entity context received.</strong> ' +
      'Confirm the Process Designer URL actually contains mail-merge tokens — a URL with no <code>@{...}</code> ' +
      'skips merging entirely (<code>Util.checkIfMailMergeRequired</code> returns false).';
  }

  // Is the native JS bridge present? Tells you first-party vs third-party
  // treatment and whether the callbacks will use the direct path.
  const bridgeEl = document.getElementById('debugBridge');
  const hasClient = !!(window.LSQExternalFormClient && typeof window.LSQExternalFormClient.onExternalFormEvent === 'function');
  const hasAuth   = !!window.AuthenticationClient;
  bridgeEl.innerHTML =
    `<div class="debug-row"><span class="debug-key">LSQExternalFormClient:</span><span class="debug-val">${hasClient ? 'present' : 'ABSENT — not running in the LSQ WebView'}</span></div>` +
    `<div class="debug-row"><span class="debug-key">AuthenticationClient:</span><span class="debug-val">${hasAuth ? 'present — host treated as FIRST PARTY' : 'absent — host treated as third party'}</span></div>` +
    `<div class="debug-row"><span class="debug-key">origin:</span><span class="debug-val">${escapeHtml(window.location.origin)}</span></div>`;

  // Native app can call this after page load to display headers it set,
  // e.g. (Android): webView.evaluateJavascript("window.showHeaders(" + json + ")", null);
  // e.g. (iOS): webView.evaluateJavaScript("window.showHeaders(\(jsonString))")
  window.showHeaders = function (headersObj) {
    const entries = Object.entries(headersObj || {});
    debugPanel.classList.add('show');
    renderKeyVals(debugHeaders, entries);
  };

  const form = document.getElementById('customForm');
  const fieldOne = document.getElementById('fieldOne');
  const fieldTwo = document.getElementById('fieldTwo');
  const fieldOneError = document.getElementById('fieldOneError');
  const fieldTwoError = document.getElementById('fieldTwoError');
  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileSelected = document.getElementById('fileSelected');
  const fileName = document.getElementById('fileName');
  const fileRemove = document.getElementById('fileRemove');
  const closeBtn = document.getElementById('closeBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function hasData() {
    return fieldOne.value.trim() !== '' ||
           fieldTwo.value.trim() !== '' ||
           fileInput.files.length > 0;
  }

  function clearForm() {
    form.reset();
    fileSelected.classList.remove('show');
    fieldOne.classList.remove('invalid');
    fieldTwo.classList.remove('invalid');
    fieldOneError.classList.remove('show');
    fieldTwoError.classList.remove('show');
  }

  // File selection (click)
  fileDrop.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      fileName.textContent = fileInput.files[0].name;
      fileSelected.classList.add('show');
    } else {
      fileSelected.classList.remove('show');
    }
  });

  fileRemove.addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.value = '';
    fileSelected.classList.remove('show');
  });

  // Drag and drop (desktop WebView / browser preview)
  ['dragenter', 'dragover'].forEach(evt =>
    fileDrop.addEventListener(evt, (e) => {
      e.preventDefault();
      fileDrop.classList.add('dragover');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    fileDrop.addEventListener(evt, (e) => {
      e.preventDefault();
      fileDrop.classList.remove('dragover');
    })
  );
  fileDrop.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length > 0) {
      fileInput.files = e.dataTransfer.files;
      fileName.textContent = fileInput.files[0].name;
      fileSelected.classList.add('show');
    }
  });

  // Inline validation on blur
  fieldOne.addEventListener('blur', () => validateField(fieldOne, fieldOneError));
  fieldTwo.addEventListener('blur', () => validateField(fieldTwo, fieldTwoError));

  function validateField(input, errorEl) {
    const valid = input.value.trim() !== '';
    input.classList.toggle('invalid', !valid);
    errorEl.classList.toggle('show', !valid);
    return valid;
  }

  // ------------------------------------------------------------------
  // LSQ external form bridge
  //
  // Contract source (do not guess these strings — they are read from the app):
  //   ExternalFormEvent.kt  @ androidcoreapp c5d76998cdb8
  //   ExternalFormClient.kt @ androidcoreapp c5d76998cdb8
  //
  //   CLIENT_NAME = "LSQExternalFormClient"
  //   method      = onExternalFormEvent(String json)
  //   payload     = { "type": "EXTERNAL_FORM", "action": "SUCCESS"|"CLOSE"|"CANCEL" }
  //
  // Native reaction:
  //   SUCCESS -> onExternalFormCloseRequested(true)   -> Activity RESULT_OK,
  //              originating screen refreshes
  //   CLOSE   -> onExternalFormCloseRequested(false)  -> Activity RESULT_CANCELED
  //   CANCEL  -> onExternalFormCloseRequested(false)  -> Activity RESULT_CANCELED
  //   anything else, or a malformed payload -> silently ignored
  //
  // Only `type` and `action` cross the bridge. Field values and file metadata
  // are NOT forwarded — the app deliberately never parses or persists external
  // form data (AC12). This page must POST its own data to its own backend
  // BEFORE signalling SUCCESS.
  // ------------------------------------------------------------------
  const LSQ_CLIENT_NAME = 'LSQExternalFormClient';
  const LSQ_EVENT_TYPE  = 'EXTERNAL_FORM';
  const LSQ_ACTION = { SUCCESS: 'SUCCESS', CLOSE: 'CLOSE', CANCEL: 'CANCEL' };

  function notifyLsq(action) {
    const event = { type: LSQ_EVENT_TYPE, action: action };

    // Path 1 — direct JS interface.
    // ExternalFormWebViewFragment.setUpWebView() registers this unconditionally,
    // for first-party and third-party hosts alike, so it is the most reliable
    // path. It also bypasses the bridge script's same-origin check entirely.
    const client = window[LSQ_CLIENT_NAME];
    if (client && typeof client.onExternalFormEvent === 'function') {
      client.onExternalFormEvent(JSON.stringify(event));
      console.log('[LSQ] sent via JS interface:', action);
      return 'jsinterface';
    }

    // Path 2 — postMessage relay installed by ExternalFormEvent.BRIDGE_SCRIPT.
    // Two things the relay is strict about:
    //   a) it drops the message unless event.origin === window.location.origin,
    //      so the target origin must be this page's own origin — not '*';
    //   b) it reads event.data as an OBJECT and checks data.type, so posting a
    //      JSON *string* here would be silently discarded.
    window.postMessage(event, window.location.origin);
    console.log('[LSQ] sent via postMessage relay:', action);
    return 'postmessage';
  }

  // Submit
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const oneValid = validateField(fieldOne, fieldOneError);
    const twoValid = validateField(fieldTwo, fieldTwoError);

    if (!oneValid || !twoValid) {
      showToast('Fix the highlighted fields.');
      return;
    }

    const payload = {
      fieldOne: fieldOne.value.trim(),
      fieldTwo: fieldTwo.value.trim(),
      file: fileInput.files.length > 0
        ? {
            name: fileInput.files[0].name,
            size: fileInput.files[0].size,
            type: fileInput.files[0].type
          }
        : null
    };

    console.log('Form submitted:', payload);

    // IMPORTANT: this page owns submission. Persist the payload to your own
    // backend here and only signal SUCCESS once that call has resolved.
    // Signalling SUCCESS first will close the webview mid-flight and the
    // originating LSQ screen will refresh against data that was never saved.
    //
    //   await fetch('/your/endpoint', { method: 'POST', body: ... });
    //   notifyLsq(LSQ_ACTION.SUCCESS);

    // The app dismisses the webview as soon as SUCCESS arrives, so this toast
    // is not visible in-app. It is kept for browser testing only; the short
    // delay lets you see it when the page is opened outside the app.
    showToast('Submitted.');
    setTimeout(() => notifyLsq(LSQ_ACTION.SUCCESS), 150);
  });

  // Close — dismiss silently, no confirmation. Native returns RESULT_CANCELED.
  closeBtn.addEventListener('click', () => {
    console.log('Form closed');
    notifyLsq(LSQ_ACTION.CLOSE);
  });

  // Cancel — confirm before clearing. Native returns RESULT_CANCELED.
  cancelBtn.addEventListener('click', () => {
    if (!hasData()) {
      console.log('Form cancelled (no data to discard)');
      notifyLsq(LSQ_ACTION.CANCEL);
      return;
    }
    confirmOverlay.classList.add('show');
  });

  confirmYes.addEventListener('click', () => {
    clearForm();
    confirmOverlay.classList.remove('show');
    console.log('Form cancelled, data discarded');
    notifyLsq(LSQ_ACTION.CANCEL);
  });

  confirmNo.addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
  });
})();
</script>

</body>
</html>
